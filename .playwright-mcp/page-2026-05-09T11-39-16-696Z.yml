  - main [ref=e11]:
    - generic [ref=e12]:
      - heading "Data Policy" [level=1] [ref=e14]
      - paragraph [ref=e15]: This Data Policy describes the practical safeguards and operating rules Bright Roof follows for website, enquiry, proposal, and project data.
      - generic [ref=e16]: "Last updated: 9 May 2026"
    - generic [ref=e17]:
      - generic [ref=e18]:
        - heading "Data minimisation" [level=2] [ref=e19]
        - paragraph [ref=e20]: We ask only for information reasonably needed to assess a rooftop, estimate solar generation, contact a society or homeowner, prepare a proposal, or support an agreement.
      - generic [ref=e21]:
        - heading "Data categories" [level=2] [ref=e22]
        - list [ref=e23]:
          - listitem [ref=e24]: "Website data: consent status, analytics events after consent, browser/device details, and page interactions."
          - listitem [ref=e25]: "Enquiry data: contact information, society details, address/location context, rooftop details, and electricity bill information."
          - listitem [ref=e26]: "Project data: site assessment notes, proposal figures, contract drafts, billing records, maintenance records, and support history."
      - generic [ref=e27]:
        - heading "Security practices" [level=2] [ref=e28]
        - paragraph [ref=e29]: We use access controls, limited internal access, service-provider review, backups where appropriate, and reasonable technical and organisational safeguards for business records. Sensitive operational or identity documents should not be sent unless requested through an agreed channel.
      - generic [ref=e30]:
        - heading "Access control" [level=2] [ref=e31]
        - paragraph [ref=e32]: Access to enquiry, proposal, contract, billing, and maintenance data is limited to partners, employees, consultants, and service providers who need it for Bright Roof work.
      - generic [ref=e33]:
        - heading "Data transfers" [level=2] [ref=e34]
        - paragraph [ref=e35]: Some service providers may process data outside Telangana or India, depending on hosting, email, analytics, document, or cloud tools used. We aim to use providers that maintain appropriate security and confidentiality commitments.
      - generic [ref=e36]:
        - heading "Incident handling" [level=2] [ref=e37]
        - paragraph [ref=e38]: If we become aware of a material data-security issue affecting personal data, we will investigate, take containment steps, and provide notices required by applicable law.
      - generic [ref=e39]:
        - heading "Future apps" [level=2] [ref=e40]
        - paragraph [ref=e41]: Calculator, PPA generation, accounting, and customer-service apps should inherit this policy baseline but may need separate notices, consent flows, role-based access controls, audit logs, and retention schedules before launch.
