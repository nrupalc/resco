    </g>
    <circle cx="200" cy="200" r="92" fill="#F5A524"/>
    <path d="M 156 232 L 200 170 L 244 232 Z" fill="#0E1E4D"/>
  </g>
  <!-- Wordmark -->
  <g transform="translate(280 0)" font-family="'Fraunces', 'Cormorant Garamond', 'Playfair Display', Georgia, serif" fill="#0E1E4D">
    <text x="0" y="120" font-size="82" font-weight="700" letter-spacing="1.5">Bright Roof</text>
    <text x="4" y="172" font-size="24" font-weight="500" letter-spacing="10" fill="#2C3444" font-family="'General Sans', 'Manrope', 'Helvetica Neue', Arial, sans-serif">POWER SYSTEMS</text>
    <line x1="4" y1="196" x2="96" y2="196" stroke="#F5A524" stroke-width="3" stroke-linecap="round"/>
    <text x="4" y="226" font-size="22" font-style="italic" font-weight="400" fill="#2C3444" font-family="'Fraunces', Georgia, serif">Solar that stays.</text>
  </g>
