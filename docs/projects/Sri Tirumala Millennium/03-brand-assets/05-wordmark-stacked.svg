<svg viewBox="0 0 500 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bright Roof Power Systems — stacked lockup">
  <title>Bright Roof Power Systems — stacked lockup</title>
  <!-- Sunburst mark, centred, top -->
  <g transform="translate(130 20) scale(0.6)">
    <g fill="#F5A524">
      <g transform="translate(200 200)">
        <polygon points="0,-180 -12,-110 12,-110"/>
        <polygon points="0,-180 -12,-110 12,-110" transform="rotate(30)"/>
        <polygon points="0,-180 -12,-110 12,-110" transform="rotate(60)"/>
        <polygon points="0,-180 -12,-110 12,-110" transform="rotate(90)"/>
        <polygon points="0,-180 -12,-110 12,-110" transform="rotate(120)"/>
        <polygon points="0,-180 -12,-110 12,-110" transform="rotate(150)"/>
        <polygon points="0,-180 -12,-110 12,-110" transform="rotate(180)"/>
        <polygon points="0,-180 -12,-110 12,-110" transform="rotate(210)"/>
        <polygon points="0,-180 -12,-110 12,-110" transform="rotate(240)"/>
        <polygon points="0,-180 -12,-110 12,-110" transform="rotate(270)"/>
        <polygon points="0,-180 -12,-110 12,-110" transform="rotate(300)"/>
        <polygon points="0,-180 -12,-110 12,-110" transform="rotate(330)"/>
      </g>
    </g>
    <circle cx="200" cy="200" r="92" fill="#F5A524"/>
    <path d="M 156 232 L 200 170 L 244 232 Z" fill="#0E1E4D"/>
  </g>
  <!-- Wordmark -->
  <g font-family="'Fraunces', 'Cormorant Garamond', 'Playfair Display', Georgia, serif" fill="#0E1E4D" text-anchor="middle">
    <text x="250" y="360" font-size="66" font-weight="700" letter-spacing="1.2">Bright Roof</text>
    <text x="250" y="400" font-size="18" font-weight="500" letter-spacing="9" fill="#2C3444" font-family="'General Sans', 'Manrope', 'Helvetica Neue', Arial, sans-serif">POWER SYSTEMS</text>
    <line x1="224" y1="426" x2="276" y2="426" stroke="#F5A524" stroke-width="3" stroke-linecap="round"/>
    <text x="250" y="462" font-size="22" font-style="italic" font-weight="400" fill="#2C3444">Solar that stays.</text>
  </g>
</svg>
