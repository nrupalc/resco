<svg width="210mm" height="297mm" viewBox="0 0 2100 2970" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bright Roof PPA cover page for Sri Tirumala Millennium">
  <title>Bright Roof PPA cover page - Sri Tirumala Millennium</title>
  <rect width="2100" height="2970" fill="#FAF6EE"/>
  <rect x="130" y="130" width="1840" height="2710" fill="none" stroke="#E8EBEF" stroke-width="4"/>

  <g transform="translate(795 290) scale(1.28)">
    <g fill="#F5A524">
      <g transform="translate(200 200)">
        <polygon points="0,-180 -12,-110 12,-110"/>
        <polygon points="0,-180 -12,-110 12,-110" transform="rotate(30)"/>
        <polygon points="0,-180 -12,-110 12,-110" transform="rotate(60)"/>
        <polygon points="0,-180 -12,-110 12,-110" transform="rotate(90)"/>
        <polygon points="0,-180 -12,-110 12,-110" transform="rotate(120)"/>
        <polygon points="0,-180 -12,-110 12,-110" transform="rotate(150)"/>
        <polygon points="0,-180 -12,-110 12,-110" transform="rotate(180)"/>
        <polygon points="0,-180 -12,-110 12,-110" transform="rotate(210)"/>
        <polygon points="0,-180 -12,-110 12,-110" transform="rotate(240)"/>
        <polygon points="0,-180 -12,-110 12,-110" transform="rotate(270)"/>
        <polygon points="0,-180 -12,-110 12,-110" transform="rotate(300)"/>
        <polygon points="0,-180 -12,-110 12,-110" transform="rotate(330)"/>
      </g>
    </g>
    <circle cx="200" cy="200" r="92" fill="#F5A524"/>
    <path d="M 156 232 L 200 170 L 244 232 Z" fill="#0E1E4D"/>
  </g>

  <text x="1050" y="910" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="118" font-weight="700" fill="#0E1E4D">Bright Roof</text>
  <text x="1050" y="985" text-anchor="middle" font-family="General Sans, Manrope, Arial, sans-serif" font-size="30" font-weight="600" letter-spacing="14" fill="#2C3444">POWER SYSTEMS</text>
  <line x1="960" y1="1060" x2="1140" y2="1060" stroke="#F5A524" stroke-width="8" stroke-linecap="round"/>
  <text x="1050" y="1135" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="42" font-style="italic" fill="#2C3444">Solar that stays.</text>

  <g transform="translate(250 1540)">
    <text x="0" y="0" font-family="General Sans, Manrope, Arial, sans-serif" font-size="34" font-weight="600" letter-spacing="6" fill="#C75B3C">WORKING DRAFT</text>
    <text x="0" y="115" font-family="Fraunces, Georgia, serif" font-size="98" font-weight="700" fill="#0E1E4D">Power Purchase</text>
    <text x="0" y="225" font-family="Fraunces, Georgia, serif" font-size="98" font-weight="700" fill="#0E1E4D">Agreement</text>
    <text x="0" y="330" font-family="General Sans, Manrope, Arial, sans-serif" font-size="42" fill="#2C3444">Sri Tirumala Millennium</text>
    <text x="0" y="392" font-family="General Sans, Manrope, Arial, sans-serif" font-size="34" fill="#6B7280">Nacharam, Hyderabad</text>
  </g>

  <g transform="translate(250 2360)" font-family="General Sans, Manrope, Arial, sans-serif" fill="#2C3444">
    <text x="0" y="0" font-size="33">Zero upfront installation cost to the society.</text>
    <text x="0" y="58" font-size="33">Solar units billed with a 10% saving against the agreed benchmark.</text>
    <text x="0" y="116" font-size="33">Bright Roof owns, operates, and maintains the system.</text>
  </g>

  <text x="250" y="2735" font-family="General Sans, Manrope, Arial, sans-serif" font-size="27" fill="#6B7280">Not legally reviewed. For discussion and data population only.</text>
  <text x="1850" y="2735" text-anchor="end" font-family="General Sans, Manrope, Arial, sans-serif" font-size="27" fill="#6B7280">v0.1</text>
</svg>
