<svg viewBox="0 0 700 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bright Roof — Typographic Sun wordmark">
  <title>Option F — Typographic Sun</title>
  <rect width="700" height="720" fill="#FAF6EE"/>
  <!-- BRIGHT, top -->
  <text x="350" y="180" text-anchor="middle" fill="#0E1E4D" font-family="'Fraunces','Playfair Display','Bodoni Moda',Georgia,serif" font-weight="900" font-size="110" letter-spacing="10">BRIGHT</text>
  <!-- Giant amber sun between -->
  <g transform="translate(350 370)">
    <g fill="#F5A524">
      <g>
        <polygon points="0,-130 -10,-84 10,-84"/>
        <polygon points="0,-130 -10,-84 10,-84" transform="rotate(30)"/>
        <polygon points="0,-130 -10,-84 10,-84" transform="rotate(60)"/>
        <polygon points="0,-130 -10,-84 10,-84" transform="rotate(90)"/>
        <polygon points="0,-130 -10,-84 10,-84" transform="rotate(120)"/>
        <polygon points="0,-130 -10,-84 10,-84" transform="rotate(150)"/>
        <polygon points="0,-130 -10,-84 10,-84" transform="rotate(180)"/>
        <polygon points="0,-130 -10,-84 10,-84" transform="rotate(210)"/>
        <polygon points="0,-130 -10,-84 10,-84" transform="rotate(240)"/>
        <polygon points="0,-130 -10,-84 10,-84" transform="rotate(270)"/>
        <polygon points="0,-130 -10,-84 10,-84" transform="rotate(300)"/>
        <polygon points="0,-130 -10,-84 10,-84" transform="rotate(330)"/>
      </g>
    </g>
    <circle r="70" fill="#F5A524"/>
  </g>
  <!-- ROOF, bottom -->
  <text x="350" y="620" text-anchor="middle" fill="#0E1E4D" font-family="'Fraunces','Playfair Display','Bodoni Moda',Georgia,serif" font-weight="900" font-size="110" letter-spacing="10">ROOF</text>
  <!-- Tagline -->
  <text x="350" y="680" text-anchor="middle" fill="#2C3444" font-family="'General Sans','Helvetica Neue',sans-serif" font-weight="500" font-size="18" letter-spacing="7">POWER SYSTEMS &#x00B7; SOLAR THAT STAYS</text>
</svg>
