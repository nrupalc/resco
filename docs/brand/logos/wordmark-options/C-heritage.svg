<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bright Roof — Heritage Stamp wordmark">
  <title>Option C — Heritage Stamp</title>
  <!-- Cream BG -->
  <rect width="900" height="560" fill="#FAF6EE"/>
  <!-- Double frame -->
  <rect x="50" y="50" width="800" height="460" fill="none" stroke="#0E1E4D" stroke-width="4"/>
  <rect x="70" y="70" width="760" height="420" fill="none" stroke="#0E1E4D" stroke-width="1"/>
  <!-- Corner diamonds -->
  <g fill="#F5A524">
    <polygon points="60,50 70,40 80,50 70,60"/>
    <polygon points="820,50 830,40 840,50 830,60"/>
    <polygon points="60,510 70,500 80,510 70,520"/>
    <polygon points="820,510 830,500 840,510 830,520"/>
  </g>
  <!-- Small sun at the top -->
  <g transform="translate(450 140) scale(0.22)">
    <g fill="#F5A524">
      <g transform="translate(200 200)">
        <polygon points="0,-180 -12,-110 12,-110"/>
        <polygon points="0,-180 -12,-110 12,-110" transform="rotate(30)"/>
        <polygon points="0,-180 -12,-110 12,-110" transform="rotate(60)"/>
        <polygon points="0,-180 -12,-110 12,-110" transform="rotate(90)"/>
        <polygon points="0,-180 -12,-110 12,-110" transform="rotate(120)"/>
        <polygon points="0,-180 -12,-110 12,-110" transform="rotate(150)"/>
        <polygon points="0,-180 -12,-110 12,-110" transform="rotate(180)"/>
        <polygon points="0,-180 -12,-110 12,-110" transform="rotate(210)"/>
        <polygon points="0,-180 -12,-110 12,-110" transform="rotate(240)"/>
        <polygon points="0,-180 -12,-110 12,-110" transform="rotate(270)"/>
        <polygon points="0,-180 -12,-110 12,-110" transform="rotate(300)"/>
        <polygon points="0,-180 -12,-110 12,-110" transform="rotate(330)"/>
      </g>
    </g>
    <circle cx="200" cy="200" r="92" fill="#F5A524"/>
    <path d="M 156 232 L 200 170 L 244 232 Z" fill="#0E1E4D"/>
  </g>
  <!-- Condensed tall serif wordmark -->
  <text x="450" y="320" text-anchor="middle" fill="#0E1E4D" font-family="'Playfair Display','Bodoni Moda','Cormorant Garamond','Didot',serif" font-weight="900" font-size="86" letter-spacing="8">BRIGHT ROOF</text>
  <!-- Italic subtitle -->
  <text x="450" y="362" text-anchor="middle" fill="#2C3444" font-family="'Fraunces',Georgia,serif" font-style="italic" font-size="28">power &amp; solar systems</text>
  <!-- Rule -->
  <line x1="300" y1="400" x2="600" y2="400" stroke="#F5A524" stroke-width="2"/>
  <text x="450" y="435" text-anchor="middle" fill="#2C3444" font-family="'General Sans','Helvetica Neue',Arial,sans-serif" font-size="16" letter-spacing="8">EST. 2026 &#x00B7; HYDERABAD</text>
  <text x="450" y="475" text-anchor="middle" fill="#0E1E4D" font-family="'Fraunces',Georgia,serif" font-style="italic" font-size="22">&#x201C;Solar that stays.&#x201D;</text>
</svg>
