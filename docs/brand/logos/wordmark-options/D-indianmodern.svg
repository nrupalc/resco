<svg viewBox="0 0 1100 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bright Roof — Indian Modern wordmark">
  <title>Option D — Indian Modern</title>
  <!-- Cream BG -->
  <rect width="1100" height="360" fill="#FAF6EE"/>
  <!-- Radial mandala-sun, geometric and precise -->
  <g transform="translate(180 180)">
    <!-- Outer ring -->
    <circle r="130" fill="none" stroke="#0E1E4D" stroke-width="2"/>
    <!-- 24 radial spokes between outer ring and inner disc -->
    <g stroke="#0E1E4D" stroke-width="2">
      <line x1="0" y1="-130" x2="0" y2="-86"/>
      <line x1="0" y1="-130" x2="0" y2="-86" transform="rotate(15)"/>
      <line x1="0" y1="-130" x2="0" y2="-86" transform="rotate(30)"/>
      <line x1="0" y1="-130" x2="0" y2="-86" transform="rotate(45)"/>
      <line x1="0" y1="-130" x2="0" y2="-86" transform="rotate(60)"/>
      <line x1="0" y1="-130" x2="0" y2="-86" transform="rotate(75)"/>
      <line x1="0" y1="-130" x2="0" y2="-86" transform="rotate(90)"/>
      <line x1="0" y1="-130" x2="0" y2="-86" transform="rotate(105)"/>
      <line x1="0" y1="-130" x2="0" y2="-86" transform="rotate(120)"/>
      <line x1="0" y1="-130" x2="0" y2="-86" transform="rotate(135)"/>
      <line x1="0" y1="-130" x2="0" y2="-86" transform="rotate(150)"/>
      <line x1="0" y1="-130" x2="0" y2="-86" transform="rotate(165)"/>
      <line x1="0" y1="-130" x2="0" y2="-86" transform="rotate(180)"/>
      <line x1="0" y1="-130" x2="0" y2="-86" transform="rotate(195)"/>
      <line x1="0" y1="-130" x2="0" y2="-86" transform="rotate(210)"/>
      <line x1="0" y1="-130" x2="0" y2="-86" transform="rotate(225)"/>
      <line x1="0" y1="-130" x2="0" y2="-86" transform="rotate(240)"/>
      <line x1="0" y1="-130" x2="0" y2="-86" transform="rotate(255)"/>
      <line x1="0" y1="-130" x2="0" y2="-86" transform="rotate(270)"/>
      <line x1="0" y1="-130" x2="0" y2="-86" transform="rotate(285)"/>
      <line x1="0" y1="-130" x2="0" y2="-86" transform="rotate(300)"/>
      <line x1="0" y1="-130" x2="0" y2="-86" transform="rotate(315)"/>
      <line x1="0" y1="-130" x2="0" y2="-86" transform="rotate(330)"/>
      <line x1="0" y1="-130" x2="0" y2="-86" transform="rotate(345)"/>
    </g>
    <!-- Inner amber disc -->
    <circle r="80" fill="#F5A524"/>
    <circle r="80" fill="none" stroke="#0E1E4D" stroke-width="2"/>
    <!-- Terracotta roof peak at centre -->
    <path d="M -28 22 L 0 -18 L 28 22 Z" fill="#C75B3C"/>
  </g>
  <!-- Wordmark -->
  <g transform="translate(350 0)">
    <text x="0" y="160" fill="#0E1E4D" font-family="'General Sans','Manrope','Helvetica Neue',Arial,sans-serif" font-weight="700" font-size="90" letter-spacing="-1">Bright Roof</text>
    <text x="4" y="210" fill="#C75B3C" font-family="'General Sans','Helvetica Neue',sans-serif" font-weight="600" font-size="18" letter-spacing="6">POWER &#x00B7; SYSTEMS &#x00B7; HYDERABAD</text>
    <line x1="4" y1="244" x2="80" y2="244" stroke="#F5A524" stroke-width="3" stroke-linecap="round"/>
    <text x="4" y="282" fill="#2C3444" font-family="'Fraunces',Georgia,serif" font-style="italic" font-size="24">Solar that stays.</text>
  </g>
</svg>
